name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, pdo, mbstring, tokenizer, xml, ctype, json, bcmath, curl, fileinfo, gd, zip
          coverage: none
          tools: composer

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Lint install.php
        run: php -l install.php

      - name: Lint convert-comments.sh
        run: bash -n convert-comments.sh

      - name: Run test suite
        run: bats tests/
